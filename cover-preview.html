<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <title>Machine Learning · 封面预览</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #212320;
      background: #f6f4ee;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    .stage {
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: center;
      min-height: 100svh;
      overflow: hidden;
      padding: clamp(24px, 7vw, 112px);
      color: inherit;
      text-decoration: none;
    }

    .stage:focus-visible { outline: 3px solid #41574b; outline-offset: -6px; }

    .field {
      position: absolute;
      z-index: -2;
      inset: 0 0 0 27%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 75% 55%, #deded1 0, transparent 68%),
        radial-gradient(circle, #7a837a 1px, transparent 1.5px) 50% 50% / 25px 25px;
      mask-image: linear-gradient(90deg, transparent, #000 38%);
    }

    .copy { position: relative; max-width: max-content; }

    h1 {
      margin: 0;
      font: 400 clamp(4.2rem, 11vw, 10.4rem)/.85 Georgia, serif;
      letter-spacing: -.065em;
    }

    h1 span { display: block; color: #44554b; }

    /* Codrops ButtonHoverStyles #07 Janus (MIT); see cover-assets/codrops-LICENSE.txt. */
    .enter { position: relative; top: clamp(44px, 7svh, 64px); left: clamp(24px, 5vw, 72px); transform: scale(.88); transform-origin: center; display: grid; place-items: center; isolation: isolate; margin-top: clamp(32px, 4vw, 52px); font-size: 20px; text-align: center; }
    .enter::before, .enter::after { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.enter {
	font-family: Georgia, serif;
	font-weight: 900;
	width: 175px;
	height: 120px;
	color: #fff;
	background: none;
}

.enter::before {
	content: '';
	background: #e6e6e6;
	-webkit-clip-path: path("M154.5,88.5 C131,113.5 62.5,110 30,89.5 C-2.5,69 -3.5,42 4.5,25.5 C12.5,9 33.5,-6 85,3.5 C136.5,13 178,63.5 154.5,88.5 Z");
	clip-path: path("M154.5,88.5 C131,113.5 62.5,110 30,89.5 C-2.5,69 -3.5,42 4.5,25.5 C12.5,9 33.5,-6 85,3.5 C136.5,13 178,63.5 154.5,88.5 Z");
	transition: clip-path 0.5s cubic-bezier(0.585, 2.5, 0.645, 0.55), -webkit-clip-path 0.5s cubic-bezier(0.585, 2.5, 0.645, 0.55), background 0.5s ease;
}

.enter:is(:hover, .stage:focus-visible .enter)::before {
	background: #000;
	-webkit-clip-path: path("M143,77 C117,96 74,100.5 45.5,91.5 C17,82.5 -10.5,57 5.5,31.5 C21.5,6 79,-5.5 130.5,4 C182,13.5 169,58 143,77 Z");
	clip-path: path("M143,77 C117,96 74,100.5 45.5,91.5 C17,82.5 -10.5,57 5.5,31.5 C21.5,6 79,-5.5 130.5,4 C182,13.5 169,58 143,77 Z");
}

.enter::after {
	content: '';
	height: 86%;
	width: 97%;
	top: 5%;
	border-radius: 58% 42% 55% 45% / 56% 45% 55% 44%;
	border: 1px solid #000;
	transform: rotate(-20deg);
	z-index: -1;
	transition: transform 0.5s cubic-bezier(0.585, 2.5, 0.645, 0.55);
}

.enter:is(:hover, .stage:focus-visible .enter)::after {
	transform: translate3d(0,-5px,0);
}

.enter span {
	display: block;
	transition: transform 0.3s ease;
	mix-blend-mode: difference;
}

.enter:is(:hover, .stage:focus-visible .enter) span {
	transform: translate3d(0,-10px,0);
}

    .enter > span { position: relative; padding-bottom: 14px; padding-right: 10px; }
    @media (prefers-reduced-motion: reduce) { .enter::before, .enter::after, .enter span { transition: none; } }

    @media (max-width: 660px) {
      .stage { align-items: start; padding-top: clamp(116px, 23svh, 215px); }
      .field {
        inset: 48% 0 0;
        mask-image: linear-gradient(180deg, transparent, #000 65%);
      }
      h1 { font-size: clamp(3.9rem, 15.5vw, 6.5rem); }
    }
  </style>
</head>
<body>
  <main>
    <a class="stage" id="entry" href="./index.html" aria-label="Click to enter">
      <div class="field" id="network" aria-hidden="true"></div>
      <div class="copy">
        <h1 lang="en">Machine <span>Learning</span></h1>
        <span class="enter" lang="en"><span>Click to enter</span></span>
      </div>
    </a>
  </main>
  <!-- Vanta NET and three.js are MIT-licensed. See cover-assets for the notices. -->
  <script src="./cover-assets/three-r134.min.js"></script>
  <script src="./cover-assets/vanta-net-0.5.24.min.js"></script>
  <script src="./cover-dissolve.js"></script>
  <script>
    const entry = document.getElementById("entry");
    const navigationKeys = new Set(["Tab", "Shift", "Control", "Alt", "Meta"]);
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    let network;
    let leaving = false;

    function syncNetwork() {
      if (reducedMotion.matches) {
        network?.destroy();
        network = undefined;
      } else if (!network && window.VANTA?.NET && window.THREE) {
        network = VANTA.NET({
          el: "#network",
          THREE: window.THREE,
          color: 0x516f5e,
          backgroundColor: 0xf6f4ee,
          points: 12,
          maxDistance: 21,
          spacing: 16,
          mouseControls: true,
          touchControls: true,
          gyroControls: false,
          scale: 1.4,
          scaleMobile: 1.7,
        });
      }
    }

    entry.addEventListener("click", (event) => {
      if (event.button !== 0 || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey) return;
      if (!window.coverDissolve) return;

      event.preventDefault();
      if (leaving) return;
      leaving = true;
      try { sessionStorage.setItem('cover-pointer', JSON.stringify({x:event.clientX / innerWidth,y:event.clientY / innerHeight,time:Date.now()})); } catch {}
      window.coverDissolve(entry.href);
    });

    document.addEventListener("keydown", (event) => {
      if (event.isComposing || event.ctrlKey || event.metaKey || event.altKey ||
          navigationKeys.has(event.key)) return;
      event.preventDefault();
      entry.click();
    });

    window.addEventListener("pageshow", (event) => {
      if (!event.persisted) return;
      document.querySelector("[data-cover-dissolve]")?.remove();
      leaving = false;
    });

    syncNetwork();
    reducedMotion.addEventListener("change", syncNetwork);
  </script>
</body>
</html>
